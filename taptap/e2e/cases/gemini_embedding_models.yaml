suite_version: 1
id: gemini_embedding_models
patch_id: gemini_embedding_models
status: active
description: Verify standard /v1/embeddings compatibility and billing for configured Gemini embedding models.

variables:
  gemini_embedding_key_alias: taptap-e2e-embed-gemini-${run_id}
  embedding_input_text: hello world from taptap e2e embedding test

shared:
  timeout_seconds: 60
  headers:
    Content-Type: application/json

scenarios:
  - id: gemini_embedding_2_preview_embedding_and_billing
    description: gemini-embedding-2-preview should work via standard /v1/embeddings and record correct spend.
    requires_env:
      - TAPTAP_E2E_BASE_URL
      - TAPTAP_E2E_MASTER_KEY
    steps:
      - id: create_gemini_embedding_key
        request:
          method: POST
          path: /key/generate
          headers:
            Authorization: Bearer ${TAPTAP_E2E_MASTER_KEY}
          json:
            key_alias: ${gemini_embedding_key_alias}
            models:
              - gemini-embedding-2-preview
        expect:
          status: 200
          json_exists:
            - key
        save:
          - from: json.key
            as: gemini_embedding_key
          - from: json.token
            as: gemini_embedding_key_hash

      - id: gemini_embedding_public_cost_map_entry
        request:
          method: GET
          path: /public/litellm_model_cost_map
        expect:
          status: 200
          json_equals:
            gemini-embedding-2-preview.litellm_provider: vertex_ai-embedding-models
            gemini-embedding-2-preview.mode: embedding
        save:
          - from: json.gemini-embedding-2-preview.input_cost_per_token
            as: gemini_embedding_input_cost_per_token

      - id: gemini_embedding_key_can_see_model
        request:
          method: GET
          path: /models
          headers:
            Authorization: Bearer ${gemini_embedding_key}
        expect:
          status: 200
          body_contains:
            - gemini-embedding-2-preview

      - id: gemini_embedding_request
        request:
          method: POST
          path: /v1/embeddings
          headers:
            Authorization: Bearer ${gemini_embedding_key}
          json:
            model: gemini-embedding-2-preview
            input: ${embedding_input_text}
        expect:
          status: 200
          json_exists:
            - data[0].embedding[0]
            - usage.prompt_tokens
            - usage.total_tokens
          json_equals:
            model: gemini-embedding-2-preview
        save:
          - from: json.usage.prompt_tokens
            as: gemini_embedding_prompt_tokens

      - id: estimate_gemini_embedding_cost
        cost_estimate:
          usage:
            input_text_tokens: ${gemini_embedding_prompt_tokens}
          pricing:
            input_cost_per_token: ${gemini_embedding_input_cost_per_token}
            output_cost_per_token: 0
          tolerance:
            absolute: 0.000001
            percent: 0.01
        save:
          - from: estimate.min_cost
            as: gemini_embedding_expected_min_cost
          - from: estimate.max_cost
            as: gemini_embedding_expected_max_cost

      - id: wait_for_gemini_embedding_spend_log
        request:
          method: GET
          path: /spend/logs/v2
          headers:
            Authorization: Bearer ${TAPTAP_E2E_MASTER_KEY}
          params:
            api_key: ${gemini_embedding_key_hash}
            start_date: ${utc_date} 00:00:00
            end_date: ${utc_date} 23:59:59
            page: 1
            page_size: 5
          poll:
            timeout_seconds: 30
            interval_seconds: 3
            success:
              json_path: data[0].model_group
              values:
                - gemini-embedding-2-preview
        expect:
          status: 200

      - id: fetch_gemini_embedding_spend_log
        request:
          method: GET
          path: /spend/logs/v2
          headers:
            Authorization: Bearer ${TAPTAP_E2E_MASTER_KEY}
          params:
            api_key: ${gemini_embedding_key_hash}
            start_date: ${utc_date} 00:00:00
            end_date: ${utc_date} 23:59:59
            page: 1
            page_size: 5
        expect:
          status: 200
          json_equals:
            data[0].call_type: aembedding
            data[0].model_group: gemini-embedding-2-preview
            data[0].custom_llm_provider: vertex_ai
          json_exists:
            - data[0].spend
          json_number_gte:
            data[0].spend: ${gemini_embedding_expected_min_cost}
          json_number_lte:
            data[0].spend: ${gemini_embedding_expected_max_cost}

    cleanup:
      - id: delete_gemini_embedding_key
        request:
          method: POST
          path: /key/delete
          headers:
            Authorization: Bearer ${TAPTAP_E2E_MASTER_KEY}
          json:
            keys:
              - ${gemini_embedding_key}
        expect:
          status: 200
