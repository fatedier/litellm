suite_version: 1
id: dashscope_anthropic_messages
patch_id: dashscope_anthropic_messages
status: active
description: Verify DashScope Anthropic-compatible Messages support and billing for GLM-5.2.

variables:
  dashscope_messages_key_alias: taptap-e2e-dashscope-messages-${run_id}
  dashscope_messages_model: z-ai/glm-5.2
  dashscope_pricing_model: dashscope/glm-5.2

shared:
  timeout_seconds: 60
  headers:
    Content-Type: application/json

scenarios:
  - id: glm_5_2_messages_and_billing
    description: glm-5.2 should work through /v1/messages and record correct DashScope spend.
    requires_env:
      - TAPTAP_E2E_BASE_URL
      - TAPTAP_E2E_MASTER_KEY
    steps:
      - id: create_dashscope_messages_key
        request:
          method: POST
          path: /key/generate
          headers:
            Authorization: Bearer ${TAPTAP_E2E_MASTER_KEY}
          json:
            key_alias: ${dashscope_messages_key_alias}
            models:
              - ${dashscope_messages_model}
        expect:
          status: 200
          json_exists:
            - key
        save:
          - from: json.key
            as: dashscope_messages_key
          - from: json.token
            as: dashscope_messages_key_hash

      - id: public_model_cost_map_has_glm_5_2
        request:
          method: GET
          path: /public/litellm_model_cost_map
        expect:
          status: 200
          json_equals:
            '["dashscope/glm-5.2"].litellm_provider': dashscope
            '["dashscope/glm-5.2"].mode': chat
        save:
          - from: 'json["dashscope/glm-5.2"].input_cost_per_token'
            as: dashscope_messages_input_cost_per_token
          - from: 'json["dashscope/glm-5.2"].output_cost_per_token'
            as: dashscope_messages_output_cost_per_token

      - id: dashscope_messages_key_can_see_model
        request:
          method: GET
          path: /models
          headers:
            Authorization: Bearer ${dashscope_messages_key}
        expect:
          status: 200
          body_contains:
            - ${dashscope_messages_model}

      - id: dashscope_messages_call
        request:
          method: POST
          path: /v1/messages
          headers:
            Authorization: Bearer ${dashscope_messages_key}
            anthropic-version: "2023-06-01"
            anthropic-beta: "prompt-caching-2024-07-31"
          json:
            model: ${dashscope_messages_model}
            max_tokens: 1024
            messages:
              - role: user
                content:
                  - type: text
                    text: Reply with one short sentence that includes the word pong.
        expect:
          status: 200
          json_exists:
            - content[0].thinking
            - content[1].text
            - usage.input_tokens
            - usage.output_tokens
          json_equals:
            content[0].type: thinking
            content[1].type: text
        save:
          - from: json.usage.input_tokens
            as: dashscope_messages_input_tokens
          - from: json.usage.output_tokens
            as: dashscope_messages_output_tokens

      - id: estimate_dashscope_messages_cost
        cost_estimate:
          usage:
            input_text_tokens: ${dashscope_messages_input_tokens}
            output_text_tokens: ${dashscope_messages_output_tokens}
          pricing:
            input_cost_per_token: ${dashscope_messages_input_cost_per_token}
            output_cost_per_token: ${dashscope_messages_output_cost_per_token}
          tolerance:
            absolute: 0.000001
            percent: 0.01
        save:
          - from: estimate.min_cost
            as: dashscope_messages_expected_min_cost
          - from: estimate.max_cost
            as: dashscope_messages_expected_max_cost

      - id: wait_for_dashscope_messages_spend_log
        request:
          method: GET
          path: /spend/logs/v2
          headers:
            Authorization: Bearer ${TAPTAP_E2E_MASTER_KEY}
          params:
            api_key: ${dashscope_messages_key_hash}
            start_date: ${utc_date} 00:00:00
            end_date: ${utc_date} 23:59:59
            page: 1
            page_size: 5
          poll:
            timeout_seconds: 45
            interval_seconds: 3
            success:
              json_path: data[0].model_group
              values:
                - ${dashscope_messages_model}
        expect:
          status: 200

      - id: fetch_dashscope_messages_spend_log
        request:
          method: GET
          path: /spend/logs/v2
          headers:
            Authorization: Bearer ${TAPTAP_E2E_MASTER_KEY}
          params:
            api_key: ${dashscope_messages_key_hash}
            start_date: ${utc_date} 00:00:00
            end_date: ${utc_date} 23:59:59
            page: 1
            page_size: 5
        expect:
          status: 200
          json_equals:
            data[0].call_type: anthropic_messages
            data[0].model_group: ${dashscope_messages_model}
            data[0].custom_llm_provider: dashscope
          json_exists:
            - data[0].spend
          json_number_gte:
            data[0].spend: ${dashscope_messages_expected_min_cost}
          json_number_lte:
            data[0].spend: ${dashscope_messages_expected_max_cost}

    cleanup:
      - id: delete_dashscope_messages_key
        request:
          method: POST
          path: /key/delete
          headers:
            Authorization: Bearer ${TAPTAP_E2E_MASTER_KEY}
          json:
            keys:
              - ${dashscope_messages_key}
        expect:
          status: 200
