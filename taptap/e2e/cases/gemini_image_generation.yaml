suite_version: 1
id: gemini_image_generation
patch_id: gemini_image_generation
status: active
description: Verify Gemini image generation compatibility and billing for gemini-3-pro-image.

variables:
  gemini_image_key_alias: taptap-e2e-gemini-image-${run_id}

shared:
  timeout_seconds: 90
  headers:
    Content-Type: application/json

scenarios:
  - id: gemini_3_pro_image_generation_and_billing
    description: A temporary key should see gemini-3-pro-image, generate an image, and record correct spend.
    requires_env:
      - TAPTAP_E2E_BASE_URL
      - TAPTAP_E2E_MASTER_KEY
    steps:
      - id: create_gemini_image_key
        request:
          method: POST
          path: /key/generate
          headers:
            Authorization: Bearer ${TAPTAP_E2E_MASTER_KEY}
          json:
            key_alias: ${gemini_image_key_alias}
            models:
              - gemini-3-pro-image
        expect:
          status: 200
          json_exists:
            - key
        save:
          - from: json.key
            as: gemini_image_key
          - from: json.token
            as: gemini_image_key_hash

      - id: public_model_cost_map_has_gemini_image_model
        request:
          method: GET
          path: /public/litellm_model_cost_map
        expect:
          status: 200
          json_equals:
            '["vertex_ai/gemini-3-pro-image"].litellm_provider': vertex_ai-language-models
            '["vertex_ai/gemini-3-pro-image"].mode': image_generation
        save:
          - from: 'json["vertex_ai/gemini-3-pro-image"].input_cost_per_token'
            as: gemini_image_input_cost_per_token
          - from: 'json["vertex_ai/gemini-3-pro-image"].output_cost_per_image_token'
            as: gemini_image_output_cost_per_image_token

      - id: gemini_image_key_can_see_model
        request:
          method: GET
          path: /models
          headers:
            Authorization: Bearer ${gemini_image_key}
        expect:
          status: 200
          body_contains:
            - gemini-3-pro-image

      - id: generate_gemini_image
        request:
          method: POST
          path: /v1/images/generations
          headers:
            Authorization: Bearer ${gemini_image_key}
          json:
            model: gemini-3-pro-image
            prompt: A small bright red ball on a plain white background.
            size: 1024x1024
        expect:
          status: 200
          json_exists:
            - created
            - data[0].b64_json
            - usage.input_tokens
            - usage.output_tokens
          json_contains:
            data[0].b64_json: iVBOR
        save:
          - from: json.usage.input_tokens
            as: gemini_image_input_tokens
          - from: json.usage.output_tokens
            as: gemini_image_output_tokens

      - id: estimate_gemini_image_cost
        cost_estimate:
          usage:
            input_text_tokens: ${gemini_image_input_tokens}
            output_image_tokens: ${gemini_image_output_tokens}
          pricing:
            input_cost_per_token: ${gemini_image_input_cost_per_token}
            output_cost_per_token: 0
            output_cost_per_image_token: ${gemini_image_output_cost_per_image_token}
          tolerance:
            absolute: 0.000001
            percent: 0.01
        save:
          - from: estimate.min_cost
            as: gemini_image_expected_min_cost
          - from: estimate.max_cost
            as: gemini_image_expected_max_cost

      - id: wait_for_gemini_image_spend_log
        request:
          method: GET
          path: /spend/logs/v2
          headers:
            Authorization: Bearer ${TAPTAP_E2E_MASTER_KEY}
          params:
            api_key: ${gemini_image_key_hash}
            start_date: ${utc_date} 00:00:00
            end_date: ${utc_date} 23:59:59
            page: 1
            page_size: 5
          poll:
            timeout_seconds: 45
            interval_seconds: 3
            success:
              json_path: data[0].model_group
              values:
                - gemini-3-pro-image
        expect:
          status: 200

      - id: fetch_gemini_image_spend_logs
        request:
          method: GET
          path: /spend/logs/v2
          headers:
            Authorization: Bearer ${TAPTAP_E2E_MASTER_KEY}
          params:
            api_key: ${gemini_image_key_hash}
            start_date: ${utc_date} 00:00:00
            end_date: ${utc_date} 23:59:59
            page: 1
            page_size: 5
        expect:
          status: 200
          json_equals:
            data[0].call_type: aimage_generation
            data[0].model_group: gemini-3-pro-image
            data[0].model: vertex_ai/gemini-3-pro-image
            data[0].custom_llm_provider: vertex_ai
          json_exists:
            - data[0].spend
          json_number_gte:
            data[0].spend: ${gemini_image_expected_min_cost}
          json_number_lte:
            data[0].spend: ${gemini_image_expected_max_cost}

    cleanup:
      - id: delete_gemini_image_key
        request:
          method: POST
          path: /key/delete
          headers:
            Authorization: Bearer ${TAPTAP_E2E_MASTER_KEY}
          json:
            keys:
              - ${gemini_image_key}
        expect:
          status: 200

  - id: gemini_3_pro_image_native_generate_content_and_billing
    description: A temporary key should call Google's native generateContent route, receive inline image data, and record correct spend.
    requires_env:
      - TAPTAP_E2E_BASE_URL
      - TAPTAP_E2E_MASTER_KEY
    steps:
      - id: create_gemini_native_image_key
        request:
          method: POST
          path: /key/generate
          headers:
            Authorization: Bearer ${TAPTAP_E2E_MASTER_KEY}
          json:
            key_alias: ${gemini_image_key_alias}-native
            models:
              - gemini-3-pro-image
        expect:
          status: 200
          json_exists:
            - key
        save:
          - from: json.key
            as: gemini_native_image_key
          - from: json.token
            as: gemini_native_image_key_hash

      - id: gemini_native_image_key_can_see_model
        request:
          method: GET
          path: /models
          headers:
            Authorization: Bearer ${gemini_native_image_key}
        expect:
          status: 200
          body_contains:
            - gemini-3-pro-image

      - id: public_model_cost_map_has_gemini_native_image_model
        request:
          method: GET
          path: /public/litellm_model_cost_map
        expect:
          status: 200
          json_equals:
            '["vertex_ai/gemini-3-pro-image"].litellm_provider': vertex_ai-language-models
            '["vertex_ai/gemini-3-pro-image"].mode': image_generation
        save:
          - from: 'json["vertex_ai/gemini-3-pro-image"].input_cost_per_token'
            as: gemini_native_image_input_cost_per_token
          - from: 'json["vertex_ai/gemini-3-pro-image"].output_cost_per_token'
            as: gemini_native_image_output_cost_per_token
          - from: 'json["vertex_ai/gemini-3-pro-image"].output_cost_per_image_token'
            as: gemini_native_image_output_cost_per_image_token

      - id: native_generate_gemini_image
        request:
          method: POST
          path: /v1beta/models/gemini-3-pro-image:generateContent
          headers:
            Authorization: Bearer ${gemini_native_image_key}
          json:
            contents:
              role: user
              parts:
                - text: Generate an image of the Eiffel tower with fireworks in the background.
            generationConfig:
              responseModalities:
                - TEXT
                - IMAGE
        expect:
          status: 200
          json_exists:
            - candidates[0].content.parts
            - usageMetadata.promptTokenCount
            - usageMetadata.candidatesTokenCount
            - usageMetadata.thoughtsTokenCount
          body_contains:
            - image/png
            - iVBOR
        save:
          - from: json.usageMetadata.promptTokenCount
            as: gemini_native_image_prompt_tokens
          - from: json.usageMetadata.candidatesTokenCount
            as: gemini_native_image_output_image_tokens
          - from: json.usageMetadata.thoughtsTokenCount
            as: gemini_native_image_reasoning_tokens

      - id: estimate_gemini_native_image_cost
        cost_estimate:
          usage:
            input_text_tokens: ${gemini_native_image_prompt_tokens}
            output_text_tokens: ${gemini_native_image_reasoning_tokens}
            output_image_tokens: ${gemini_native_image_output_image_tokens}
          pricing:
            input_cost_per_token: ${gemini_native_image_input_cost_per_token}
            output_cost_per_token: ${gemini_native_image_output_cost_per_token}
            output_cost_per_image_token: ${gemini_native_image_output_cost_per_image_token}
          tolerance:
            absolute: 0.000001
            percent: 0.01
        save:
          - from: estimate.min_cost
            as: gemini_native_image_expected_min_cost
          - from: estimate.max_cost
            as: gemini_native_image_expected_max_cost

      - id: wait_for_gemini_native_image_spend_log
        request:
          method: GET
          path: /spend/logs/v2
          headers:
            Authorization: Bearer ${TAPTAP_E2E_MASTER_KEY}
          params:
            api_key: ${gemini_native_image_key_hash}
            start_date: ${utc_date} 00:00:00
            end_date: ${utc_date} 23:59:59
            page: 1
            page_size: 5
          poll:
            timeout_seconds: 45
            interval_seconds: 3
            success:
              json_path: data[0].call_type
              values:
                - agenerate_content
        expect:
          status: 200

      - id: fetch_gemini_native_image_spend_logs
        request:
          method: GET
          path: /spend/logs/v2
          headers:
            Authorization: Bearer ${TAPTAP_E2E_MASTER_KEY}
          params:
            api_key: ${gemini_native_image_key_hash}
            start_date: ${utc_date} 00:00:00
            end_date: ${utc_date} 23:59:59
            page: 1
            page_size: 5
        expect:
          status: 200
          json_equals:
            data[0].call_type: agenerate_content
            data[0].model_group: gemini-3-pro-image
            data[0].model: vertex_ai/gemini-3-pro-image
            data[0].custom_llm_provider: vertex_ai
          json_exists:
            - data[0].spend
          json_number_gte:
            data[0].spend: ${gemini_native_image_expected_min_cost}
          json_number_lte:
            data[0].spend: ${gemini_native_image_expected_max_cost}

    cleanup:
      - id: delete_gemini_native_image_key
        request:
          method: POST
          path: /key/delete
          headers:
            Authorization: Bearer ${TAPTAP_E2E_MASTER_KEY}
          json:
            keys:
              - ${gemini_native_image_key}
        expect:
          status: 200
